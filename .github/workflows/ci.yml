name: Verify ESP32 temperature monitor

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp32-temp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Host tests and pinned ESP-IDF build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Linux verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake libpng-dev ripgrep \
            libusb-1.0-0-dev libffi-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned web dependencies
        run: npm --prefix web ci

      - name: Build web assets for firmware embedding
        run: npm --prefix web run build

      - name: Check for leaked secrets and out-of-date generated contract types
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-secret-leaks.py
          ./tools/check-contracts.sh

      - name: Cache pinned ESP-IDF toolchain
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/esp-idf-v6.1
            ~/.espressif
          key: ${{ runner.os }}-idf-v6.1-fff9895c82d744c7237be8847347bdd1b07c6643-v1

      - name: Install pinned ESP-IDF v6.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          IDF_DIR="$RUNNER_TEMP/esp-idf-v6.1"
          git init "$IDF_DIR"
          git -C "$IDF_DIR" remote add origin https://github.com/espressif/esp-idf.git
          git -C "$IDF_DIR" fetch --depth 1 origin fff9895c82d744c7237be8847347bdd1b07c6643
          git -C "$IDF_DIR" checkout --detach FETCH_HEAD
          git -C "$IDF_DIR" submodule update --init --recursive --depth 1
          "$IDF_DIR/install.sh" esp32s3

      - name: Check C++ formatting with the ESP-IDF clang-format
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/esp-idf-v6.1/export.sh"
          clang-format --version
          rg --files -0 firmware -g '*.cpp' -g '*.hpp' -g '*.h' -g '!**/build/**' -g '!**/managed_components/**' -g '!**/generated/**' | xargs -0 clang-format --dry-run --Werror

      - name: Build firmware and resolve pinned managed components
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/esp-idf-v6.1/export.sh"
          ./tools/check-sdk.sh
          (cd firmware && idf.py build)

      - name: Check the release image configuration
        shell: bash
        run: |
          set -euo pipefail
          # A clean build resolves its configuration from sdkconfig.defaults. The normal image must
          # read the DS18B20 bus; a missing option would leave every probe permanently unread.
          grep -qx 'CONFIG_MONITOR_SENSOR_BUS=y' firmware/sdkconfig
          # A hung task must panic and reset so a pending OTA image can roll back.
          grep -qx 'CONFIG_ESP_TASK_WDT_PANIC=y' firmware/sdkconfig

      - name: Run full host, display, web and firmware verification
        shell: bash
        env:
          # The web app was built once above and is what the firmware embeds; do not rebuild it.
          SKIP_WEB_BUILD: "1"
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/esp-idf-v6.1/export.sh"
          ./tools/verify.sh --firmware

      - name: Generate CI-only firmware and web provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_provenance.py --commit "${GITHUB_SHA}" \
            --idf-path "$RUNNER_TEMP/esp-idf-v6.1"

      - name: Upload firmware binary and build manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-firmware-${{ github.sha }}
          path: |
            firmware/build/temperature_monitor.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/flasher_args.json
            firmware/build/provenance/manifest.json
            firmware/build/provenance/SHA256SUMS.txt
            firmware/partitions.csv
            web/package.json
            web/package-lock.json
            web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Download uploaded firmware artifact for verification
        uses: actions/download-artifact@v4
        with:
          name: esp32-s3-firmware-${{ github.sha }}
          path: ${{ runner.temp }}/firmware-artifact-verify

      - name: Verify downloaded firmware artifact checksums and source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/firmware-artifact-verify"
          sha256sum -c firmware/build/provenance/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("firmware/build/provenance/manifest.json").read_text(encoding="utf-8"))
          assert manifest["source_commit"] == os.environ["GITHUB_SHA"]
          assert manifest["qualification"] == "CI_BUILD_ONLY_NOT_RELEASE_APPROVED"
          PY
